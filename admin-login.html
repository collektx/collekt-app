<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>Admin Sign In &mdash; Collekt Operational Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=109.0">
<link rel="stylesheet" href="shared.css?v=109.0">
<link rel="stylesheet" href="glass.css?v=109.0">

<style>
  body {
    background: radial-gradient(circle at 50% 20%, #0e3b35 0%, #09201d 45%, #040e0d 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #fff;
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, rgba(0,0,0,0) 70%);
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .admin-login-card {
    background: rgba(14, 59, 53, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid rgba(34, 197, 94, 0.35);
    border-radius: 28px;
    padding: 40px 36px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 32px 90px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    position: relative;
    z-index: 10;
    animation: cardAppear .35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .admin-logo-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
  }
  .admin-logo-head img {
    height: 52px;
    margin-bottom: 14px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }
  .admin-badge-pill {
    background: rgba(34, 197, 94, 0.18);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.4);
    font-size: 11px;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 99px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .admin-form-group {
    margin-bottom: 20px;
  }
  .admin-form-group label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: #cbd5e1;
    margin-bottom: 8px;
    letter-spacing: .02em;
  }
  .admin-form-input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    background: rgba(4, 14, 13, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    transition: all .2s ease;
    box-sizing: border-box;
  }
  .admin-form-input:focus {
    outline: none;
    border-color: #22c55e;
    box-shadow: 0 0 0 3.5px rgba(34, 197, 94, 0.25);
    background: rgba(4, 14, 13, 0.85);
  }
  .admin-submit-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(22, 163, 74, 0.35);
    transition: all .2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    touch-action: manipulation;
  }
  .admin-submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(22, 163, 74, 0.5);
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
  }
  .admin-submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }
  .error-alert {
    background: rgba(220, 38, 38, 0.2);
    border: 1px solid rgba(220, 38, 38, 0.5);
    color: #fca5a5;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 20px;
    display: none;
    animation: fadeIn .2s ease;
  }
  .spinner-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="admin-login-card">
  <div class="admin-logo-head">
    <img src="logo-stone.png" alt="Collekt Admin" onerror="this.src='logo-stone.jpg'" loading="lazy" decoding="async">
    <span class="admin-badge-pill">&#128081; Operational Command Center</span>
    <h2 style="font-size:22px; font-weight:900; margin-top:2px;">Administrator Portal</h2>
    <p style="font-size:12px; color:#94a3b8; margin-top:4px;">Sign in with authorized administrative credentials</p>
  </div>

  <div id="adminErrorAlert" class="error-alert"></div>

  <form id="adminLoginForm" onsubmit="handleAdminLoginSubmit(event)" autocomplete="off">
    <div class="admin-form-group">
      <label for="adminEmailVal">Admin Email / Username</label>
      <input type="text" id="adminEmailVal" class="admin-form-input" placeholder="admin@collekt.ng" required autocomplete="username" autocapitalize="none" autofocus>
    </div>

    <div class="admin-form-group">
      <label for="adminPassVal">Admin Password</label>
      <div style="position:relative;">
        <input type="password" id="adminPassVal" class="admin-form-input" placeholder="Enter password" required autocomplete="current-password">
        <button type="button" onclick="togglePassVisibility()" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; cursor:pointer; font-size:13px; font-weight:800;" aria-label="Toggle password visibility">👁️</button>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:12px;">
      <span style="color:#94a3b8; font-size:11.5px; display:inline-flex; align-items:center; gap:5px;">
        🔒 Operational Command Center
      </span>
      <a href="login.html" style="color:#4ade80; font-weight:800; text-decoration:none;">User Sign In &rarr;</a>
    </div>

    <button type="submit" id="adminLoginBtn" class="admin-submit-btn">
      🔑 Authenticate &amp; Launch Command Portal
    </button>
  </form>

  <div style="margin-top:22px; padding-top:18px; border-top:1px solid rgba(255,255,255,0.1); text-align:center; font-size:11px; color:#64748b; line-height:1.5;">
    🔒 Master Administrator Access Authorized &bull; Full Platform Control<br>All administrative operations are monitored and recorded.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=109.0"></script>
<script src="app.js?v=109.0"></script>
<script>
  function togglePassVisibility() {
    const input = document.getElementById('adminPassVal');
    if (input) {
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  }

  async function handleAdminLoginSubmit(e) {
    if (e) e.preventDefault();
    const rawInput = (document.getElementById('adminEmailVal')?.value || '').trim().toLowerCase();
    const email = rawInput;
    const password = (document.getElementById('adminPassVal')?.value || '').trim();
    const alertBox = document.getElementById('adminErrorAlert');
    const btn = document.getElementById('adminLoginBtn');

    if (!rawInput || !password) {
      if (alertBox) {
        alertBox.textContent = '⚠️ Please enter both your admin username/email and password.';
        alertBox.style.display = 'block';
      }
      return;
    }

    if (alertBox) alertBox.style.display = 'none';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-icon"></span> Authenticating Admin...';
    }

    // Authenticate exclusively with official Supabase database credentials
    try {
      if (window.sb && window.sb.auth) {
        const { data, error } = await sb.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (!error && data && data.user) {
          const { data: profile } = await sb
            .from('profiles')
            .select('id, email, role, name')
            .eq('id', data.user.id)
            .single();

          if (profile && profile.role === 'admin') {
            const adminSession = {
              id: data.user.id,
              email: data.user.email,
              name: profile.name || 'Administrator',
              role: 'admin',
              token: 'adm_sb_' + Date.now(),
              authenticatedAt: new Date().toISOString()
            };
            localStorage.setItem('collekt_admin_auth', JSON.stringify(adminSession));
            localStorage.setItem('collekt_user', JSON.stringify(adminSession));
            localStorage.setItem('collekt_last_role', 'admin');
            sessionStorage.setItem('collekt_admin_auth', JSON.stringify(adminSession));
            sessionStorage.setItem('collekt_user', JSON.stringify(adminSession));
            document.cookie = "collekt_admin_auth=1; path=/; max-age=86400; SameSite=Lax";

            if (alertBox) {
              alertBox.style.background = 'rgba(34, 197, 94, 0.2)';
              alertBox.style.borderColor = 'rgba(34, 197, 94, 0.6)';
              alertBox.style.color = '#4ade80';
              alertBox.innerHTML = '✅ <strong>Access Authorized!</strong> Initializing Operational Command Dashboard...';
              alertBox.style.display = 'block';
            }

            setTimeout(() => {
              window.location.href = 'admin-dashboard.html';
            }, 300);
            return;
          } else {
            if (alertBox) {
              alertBox.style.background = 'rgba(220, 38, 38, 0.2)';
              alertBox.style.borderColor = 'rgba(220, 38, 38, 0.5)';
              alertBox.style.color = '#fca5a5';
              alertBox.textContent = '⛔ Access Denied: This account does not have administrative privileges.';
              alertBox.style.display = 'block';
            }
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = '🔑 Authenticate &amp; Launch Command Portal';
            }
            return;
          }
        }
      }
    } catch (err) {
      console.warn('Supabase remote admin auth notice:', err);
    }

    if (alertBox) {
      alertBox.style.background = 'rgba(220, 38, 38, 0.2)';
      alertBox.style.borderColor = 'rgba(220, 38, 38, 0.5)';
      alertBox.style.color = '#fca5a5';
      alertBox.textContent = '⚠️ Invalid administrative credentials. Please check your email and password.';
      alertBox.style.display = 'block';
    }
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '🔑 Authenticate &amp; Launch Command Portal';
    }
  }

  (function checkAdminTimeoutNotice() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('reason') === 'timeout') {
      const alertBox = document.getElementById('adminErrorAlert');
      if (alertBox) {
        alertBox.style.background = 'rgba(19, 117, 111, 0.25)';
        alertBox.style.borderColor = 'rgba(19, 117, 111, 0.6)';
        alertBox.style.color = '#a7f3d0';
        alertBox.textContent = '🔒 Administrative session closed after 15 minutes of inactivity for compliance and treasury protection.';
        alertBox.style.display = 'block';
      }
    }
  })();
</script>
</body>
</html>
