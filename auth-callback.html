<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating | Collekt</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #0E3B35;
      --teal: #13756F;
      --amber: #D4920B;
      --bg: #F4F7F6;
      --surface: #FFFFFF;
      --ink: #0D1F1E;
      --muted: #6B8280;
      --line: #E2EAE9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(14, 59, 53, 0.08);
      position: relative;
      overflow: hidden;
    }
    .top-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      width: 100%;
      background: rgba(19, 117, 111, 0.15);
      overflow: hidden;
    }
    .top-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--forest), var(--teal), var(--amber));
      width: 40%;
      border-radius: 4px;
      animation: progressSlide 1.2s infinite ease-in-out;
    }
    @keyframes progressSlide {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(100%); width: 60%; }
      100% { transform: translateX(300%); width: 30%; }
    }
    .brand-logo {
      height: 42px;
      width: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .spinner-wrap {
      margin: 20px auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(19, 117, 111, 0.15);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--forest);
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.55;
    }
    .error-box {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 20px;
      text-align: left;
    }
    .btn-retry {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: var(--forest);
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      transition: all .2s;
    }
    .btn-retry:hover {
      background: var(--teal);
    }
    .otp-box {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      border-radius: 12px;
      background: rgba(19, 117, 111, 0.05);
      border: 1.5px solid var(--line);
      color: var(--ink);
      outline: none;
      transition: all .2s;
    }
    .otp-box:focus {
      border-color: var(--teal);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(19, 117, 111, 0.15);
    }
    @media (max-width: 480px) {
      .otp-box {
        width: 38px;
        height: 46px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="top-progress"><div class="top-progress-bar"></div></div>
    <img src="logo-stone.jpg" alt="Collekt" class="brand-logo" onerror="this.style.display='none'; document.getElementById('txtLogo').style.display='block';">
    <div id="txtLogo" style="display:none; font-size:24px; font-weight:900; color:var(--forest); margin-bottom:20px;">Coll<span style="color:var(--amber);">ekt</span></div>
    
    <div class="spinner-wrap" id="spinnerWrap">
      <div class="spinner"></div>
    </div>
    
    <h2 id="statusTitle">Completing sign in...</h2>
    <p id="statusDesc">Authenticating with Google and preparing your dashboard.</p>

    <div class="error-box" id="errorBox">
      <div style="font-weight:800; margin-bottom:4px;">Authentication Notice</div>
      <div id="errorDesc">Unable to complete Google sign-in.</div>
      <a href="login.html" class="btn-retry">Return to Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=151.0"></script>
  <script src="app.js?v=151.0"></script>
  <script>
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    (async function initCallback() {
      const hash = window.location.hash || '';
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(hash.startsWith('#') ? hash.substring(1) : hash);

      const err = params.get('error') || hashParams.get('error') || params.get('error_description') || hashParams.get('error_description');
      if (err) {
        document.getElementById('spinnerWrap').style.display = 'none';
        document.getElementById('statusTitle').textContent = 'Sign-in Failed';
        document.getElementById('statusDesc').textContent = 'We encountered an issue authenticating your account.';
        const errBox = document.getElementById('errorBox');
        errBox.style.display = 'block';
        document.getElementById('errorDesc').textContent = decodeURIComponent(err.replace(/\+/g, ' '));
        return;
      }

      let attempts = 0;
      async function checkSessionAndProceed() {
        attempts++;
        if (window.sb && window.sb.auth) {
          try {
            const { data: { session } } = await window.sb.auth.getSession();
            if (session && session.user) {
              const isLinkingLinkedIn = params.get('link_identity') === 'linkedin' || 
                                        localStorage.getItem('collekt_pending_linkedin_link') || 
                                        sessionStorage.getItem('collekt_linking_linkedin_target');

              const provider = session.user.app_metadata?.provider || '';
              const isLinkedIn = isLinkingLinkedIn || provider === 'linkedin_oidc' || provider === 'linkedin';

              // EXCLUDED: LinkedIn registration and sign-in bypasses OTP completely
              if (isLinkedIn) {
                document.getElementById('statusTitle').textContent = isLinkingLinkedIn ? 'LinkedIn Account Connected!' : 'Success!';
                document.getElementById('statusDesc').textContent = isLinkingLinkedIn ? 'Verifying real LinkedIn credentials and returning to your profile...' : 'Loading your dashboard...';
                await handleOAuthSessionRouting(session);
                return;
              }

              // Google OAuth verification check:
              let isOtpVerified = false;
              let profile = null;
              try {
                const { data: prof } = await window.sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
                profile = prof;
                if (prof && prof.otp_verified === true) {
                  isOtpVerified = true;
                }
              } catch(e) {}

              // If already verified or admin, route straight to dashboard
              if (isOtpVerified || (profile && profile.role === 'admin')) {
                document.getElementById('statusTitle').textContent = 'Success!';
                document.getElementById('statusDesc').textContent = 'Loading your dashboard...';
                await handleOAuthSessionRouting(session);
                return;
              }

              // NEW GOOGLE SIGNUP / UNVERIFIED GOOGLE USER -> REQUIRE OTP!
              renderGoogleOtpScreen(session, profile);
              return;
            }
          } catch(e) {
            console.warn('Session check error:', e);
          }
        }

        if (attempts < 15) {
          setTimeout(checkSessionAndProceed, 200);
        } else {
          document.getElementById('spinnerWrap').style.display = 'none';
          document.getElementById('statusTitle').textContent = 'Taking longer than expected';
          document.getElementById('statusDesc').textContent = 'Redirecting to login page...';
          setTimeout(() => {
            window.location.replace('login.html');
          }, 1200);
        }
      }

      function renderGoogleOtpScreen(session, profile) {
        const spinner = document.getElementById('spinnerWrap');
        if (spinner) spinner.style.display = 'none';

        const title = document.getElementById('statusTitle');
        const desc = document.getElementById('statusDesc');
        if (title) title.textContent = 'Verify Your Email 🔐';
        if (desc) desc.innerHTML = `We sent a 6-digit verification code to <strong style="color:var(--forest);">${escapeHTML(session.user.email)}</strong>. Enter it below to access your dashboard:`;

        const userEmail = session.user.email;
        const userName = session.user.user_metadata?.full_name || session.user.user_metadata?.name || (profile && profile.name) || '';
        const userRole = localStorage.getItem('collekt_last_role') || (profile && profile.role) || 'professional';

        if (document.getElementById('googleOtpForm')) return;

        const formContainer = document.createElement('div');
        formContainer.id = 'googleOtpForm';
        formContainer.style.marginTop = '24px';
        formContainer.innerHTML = `
          <div style="display:flex; justify-content:center; gap:8px; margin-bottom:18px;">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-box" data-idx="0" autocomplete="one-time-code">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-box" data-idx="1">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-box" data-idx="2">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-box" data-idx="3">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-box" data-idx="4">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-box" data-idx="5">
          </div>
          <div id="googleOtpError" style="display:none; color:#991B1B; background:#FEF2F2; border:1px solid #FCA5A5; border-radius:10px; padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:14px; text-align:center;"></div>
          <div id="googleOtpSuccess" style="display:none; color:#065F46; background:#ECFDF5; border:1px solid #A7F3D0; border-radius:10px; padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:14px; text-align:center;"></div>
          <button type="button" id="googleSubmitBtn" style="width:100%; padding:14px; background:var(--forest); border:none; color:#fff; border-radius:12px; font-size:14.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 16px rgba(14,59,53,0.2); transition:all .2s;">
            <span>Verify &amp; Access Dashboard &rarr;</span>
          </button>
          <div style="margin-top:18px; font-size:13px; color:var(--muted); display:flex; justify-content:center; align-items:center; gap:6px;">
            <span>Didn't get the code?</span>
            <button type="button" id="googleResendBtn" style="background:none; border:none; color:var(--teal); font-weight:800; cursor:pointer; padding:0; text-decoration:underline;">
              Resend Code
            </button>
            <span id="googleCountdown" style="color:var(--muted); font-size:12px; display:none;"></span>
          </div>
          <div style="margin-top:14px; font-size:11.5px; color:var(--muted);">
            ⏱ Code expires in 10 minutes &bull; Protected by NDPA 2023
          </div>
        `;

        document.querySelector('.auth-card').appendChild(formContainer);

        const boxes = formContainer.querySelectorAll('.otp-box');
        boxes.forEach((box, index) => {
          box.oninput = function() {
            const val = this.value.replace(/\D/g, '');
            this.value = val ? val[0] : '';
            if (this.value && index < boxes.length - 1) {
              boxes[index + 1].focus();
            }
          };
          box.onkeydown = function(e) {
            if (e.key === 'Backspace' && !this.value && index > 0) {
              boxes[index - 1].focus();
            } else if (e.key === 'Enter') {
              e.preventDefault();
              submitGoogleOtp();
            }
          };
          box.onpaste = function(e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
            if (text) {
              for (let i = 0; i < boxes.length; i++) {
                boxes[i].value = text[i] || '';
              }
              const focusTarget = Math.min(text.length, boxes.length - 1);
              boxes[focusTarget].focus();
            }
          };
        });

        setTimeout(() => { if (boxes[0]) boxes[0].focus(); }, 100);

        // Send initial OTP email via /api/auth-otp
        fetch('/api/auth-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send_otp', email: userEmail, name: userName, role: userRole })
        }).catch(e => console.warn('[auth-otp] Send error:', e));

        let countdown = 60;
        let timer = null;
        const resendBtn = document.getElementById('googleResendBtn');
        const countSpan = document.getElementById('googleCountdown');

        function startTimer() {
          countdown = 60;
          resendBtn.disabled = true;
          resendBtn.style.opacity = '0.5';
          countSpan.textContent = `(${countdown}s)`;
          countSpan.style.display = 'inline';
          if (timer) clearInterval(timer);
          timer = setInterval(() => {
            countdown--;
            countSpan.textContent = `(${countdown}s)`;
            if (countdown <= 0) {
              clearInterval(timer);
              resendBtn.disabled = false;
              resendBtn.style.opacity = '1';
              countSpan.style.display = 'none';
            }
          }, 1000);
        }
        startTimer();

        resendBtn.onclick = async function() {
          if (countdown > 0) return;
          resendBtn.textContent = 'Sending...';
          const errBox = document.getElementById('googleOtpError');
          const succBox = document.getElementById('googleOtpSuccess');
          if (errBox) errBox.style.display = 'none';
          if (succBox) succBox.style.display = 'none';

          try {
            const res = await fetch('/api/auth-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'resend_otp', email: userEmail, name: userName, role: userRole })
            });
            const d = await res.json().catch(() => ({}));
            if (d && d.success) {
              succBox.textContent = '✓ A new verification code has been sent to your email.';
              succBox.style.display = 'block';
              startTimer();
            } else {
              errBox.textContent = (d && d.error) || 'Failed to resend code. Please try again.';
              errBox.style.display = 'block';
            }
          } catch(e) {
            errBox.textContent = 'Network error while resending. Please check your connection.';
            errBox.style.display = 'block';
          } finally {
            resendBtn.textContent = 'Resend Code';
          }
        };

        const submitBtn = document.getElementById('googleSubmitBtn');
        async function submitGoogleOtp() {
          const errBox = document.getElementById('googleOtpError');
          const succBox = document.getElementById('googleOtpSuccess');
          if (errBox) errBox.style.display = 'none';
          if (succBox) succBox.style.display = 'none';

          let code = '';
          boxes.forEach(b => code += (b.value || '').trim());
          if (code.length !== 6 || !/^\d{6}$/.test(code)) {
            errBox.textContent = 'Please enter all 6 digits of the verification code.';
            errBox.style.display = 'block';
            return;
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span>Verifying code... ⏳</span>';

          try {
            const res = await fetch('/api/auth-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'verify_otp', email: userEmail, code, name: userName, role: userRole })
            });
            const d = await res.json().catch(() => ({}));
            if (!res.ok || !d || !d.success) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<span>Verify &amp; Access Dashboard &rarr;</span>';
              errBox.textContent = (d && d.error) || 'Invalid or expired verification code. Please try again.';
              errBox.style.display = 'block';
              return;
            }

            // OTP Verified! Welcome email dispatched by backend!
            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.innerHTML = '<span>✓ Verified! Entering Dashboard in 2s...</span>';
            }
            if (succBox) {
              succBox.innerHTML = '🎉 <strong>Code Verified!</strong> Welcome email sent to your inbox. Loading dashboard in <strong>2s</strong>...';
              succBox.style.display = 'block';
            }

            if (profile) {
              profile.email_verified = true;
              profile.otp_verified = true;
              if (typeof setUser === 'function') setUser(profile);
            }
            try {
              let u = JSON.parse(localStorage.getItem('collekt_user') || '{}');
              u.otp_verified = true;
              u.email_verified = true;
              localStorage.setItem('collekt_user', JSON.stringify(u));
              if (typeof saveRegisteredUser === 'function') saveRegisteredUser(u);
            } catch(e) {}

            setTimeout(() => {
              if (submitBtn) submitBtn.innerHTML = '<span>✓ Verified! Entering Dashboard in 1s...</span>';
              if (succBox) succBox.innerHTML = '🎉 <strong>Code Verified!</strong> Welcome email sent to your inbox. Loading dashboard in <strong>1s</strong>...';
            }, 1000);

            setTimeout(async () => {
              await handleOAuthSessionRouting(session);
            }, 2000);

          } catch(e) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Verify &amp; Access Dashboard &rarr;</span>';
            errBox.textContent = 'Network error while verifying. Please check your connection.';
            errBox.style.display = 'block';
          }
        }
        submitBtn.onclick = submitGoogleOtp;
      }

      checkSessionAndProceed();
    })();
  </script>
</body>
</html>
