<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating | Collekt</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #0E3B35;
      --teal: #13756F;
      --amber: #D4920B;
      --bg: #F4F7F6;
      --surface: #FFFFFF;
      --ink: #0D1F1E;
      --muted: #6B8280;
      --line: #E2EAE9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(14, 59, 53, 0.08);
      position: relative;
      overflow: hidden;
    }
    .top-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      width: 100%;
      background: rgba(19, 117, 111, 0.15);
      overflow: hidden;
    }
    .top-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--forest), var(--teal), var(--amber));
      width: 40%;
      border-radius: 4px;
      animation: progressSlide 1.2s infinite ease-in-out;
    }
    @keyframes progressSlide {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(100%); width: 60%; }
      100% { transform: translateX(300%); width: 30%; }
    }
    .brand-logo {
      height: 42px;
      width: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .spinner-wrap {
      margin: 20px auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(19, 117, 111, 0.15);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--forest);
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.55;
    }
    .error-box {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 20px;
      text-align: left;
    }
    .btn-retry {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: var(--forest);
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      transition: all .2s;
    }
    .btn-retry:hover {
      background: var(--teal);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="top-progress"><div class="top-progress-bar"></div></div>
    <img src="logo-stone.jpg" alt="Collekt" class="brand-logo" onerror="this.style.display='none'; document.getElementById('txtLogo').style.display='block';">
    <div id="txtLogo" style="display:none; font-size:24px; font-weight:900; color:var(--forest); margin-bottom:20px;">Coll<span style="color:var(--amber);">ekt</span></div>
    
    <div class="spinner-wrap" id="spinnerWrap">
      <div class="spinner"></div>
    </div>
    
    <h2 id="statusTitle">Completing sign in...</h2>
    <p id="statusDesc">Authenticating with Google and preparing your dashboard.</p>

    <div class="error-box" id="errorBox">
      <div style="font-weight:800; margin-bottom:4px;">Authentication Notice</div>
      <div id="errorDesc">Unable to complete Google sign-in.</div>
      <a href="login.html" class="btn-retry">Return to Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=49.0"></script>
  <script src="app.js?v=49.0"></script>
  <script>
    (async function initCallback() {
      const hash = window.location.hash || '';
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(hash.startsWith('#') ? hash.substring(1) : hash);

      const err = params.get('error') || hashParams.get('error') || params.get('error_description') || hashParams.get('error_description');
      if (err) {
        document.getElementById('spinnerWrap').style.display = 'none';
        document.getElementById('statusTitle').textContent = 'Sign-in Failed';
        document.getElementById('statusDesc').textContent = 'We encountered an issue authenticating your account.';
        const errBox = document.getElementById('errorBox');
        errBox.style.display = 'block';
        document.getElementById('errorDesc').textContent = decodeURIComponent(err.replace(/\+/g, ' '));
        return;
      }

      let attempts = 0;
      async function checkSessionAndProceed() {
        attempts++;
        if (window.sb && window.sb.auth) {
          try {
            const { data: { session } } = await window.sb.auth.getSession();
            if (session && session.user) {
              const isLinkingLinkedIn = params.get('link_identity') === 'linkedin' || 
                                        localStorage.getItem('collekt_pending_linkedin_link') || 
                                        sessionStorage.getItem('collekt_linking_linkedin_target');

              if (isLinkingLinkedIn) {
                document.getElementById('statusTitle').textContent = 'LinkedIn Account Connected!';
                document.getElementById('statusDesc').textContent = 'Verifying real LinkedIn credentials and returning to your profile...';
                await handleOAuthSessionRouting(session);
                return;
              }

              document.getElementById('statusTitle').textContent = 'Success!';
              document.getElementById('statusDesc').textContent = 'Loading your dashboard...';
              await handleOAuthSessionRouting(session);
              return;
            }
          } catch(e) {
            console.warn('Session check error:', e);
          }
        }

        if (attempts < 15) {
          setTimeout(checkSessionAndProceed, 200);
        } else {
          document.getElementById('spinnerWrap').style.display = 'none';
          document.getElementById('statusTitle').textContent = 'Taking longer than expected';
          document.getElementById('statusDesc').textContent = 'Redirecting to login page...';
          setTimeout(() => {
            window.location.replace('login.html');
          }, 1200);
        }
      }

      checkSessionAndProceed();
    })();
  </script>
</body>
</html>
