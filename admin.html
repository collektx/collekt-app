<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<title>Collekt &mdash; Operational Command Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 30%, #0e3b35 0%, #071917 55%, #040e0d 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Manrope', sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .gateway-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #22c55e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="gateway-spinner"></div>
  <h2 style="font-size:18px; font-weight:900; margin:0 0 6px;">Verifying Administrative Permissions</h2>
  <p style="font-size:12.5px; color:#94a3b8; margin:0;">Connecting to Collekt Security Authority...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=55.0"></script>
  <script src="app.js?v=55.0"></script>
  <script>
    (async function() {
      try {
        const localAdmin = JSON.parse(localStorage.getItem('collekt_admin_auth') || sessionStorage.getItem('collekt_admin_auth') || 'null');
        if (localAdmin && localAdmin.role === 'admin') {
          window.location.replace('admin-dashboard.html');
          return;
        }
        if (typeof checkAdminSession === 'function') {
          const authData = await checkAdminSession();
          if (authData && authData.profile && authData.profile.role === 'admin') {
            window.location.replace('admin-dashboard.html');
            return;
          }
        }
        window.location.replace('admin-login.html');
      } catch(err) {
        console.error('Admin gateway error:', err);
        window.location.replace('admin-login.html');
      }
    })();
  </script>
</body>
</html>
