# Netlify Configuration for Collekt Static Deployment & Admin Portal

[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "node build_and_sync.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security Headers & Global Settings
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://js.paystack.co https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://ui-avatars.com https://*.googleusercontent.com https://flagcdn.com https://flagsapi.com https://*.paystack.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.paystack.co https://checkout.paystack.com https://standard.paystack.co https://api.korapay.com https://generativelanguage.googleapis.com https://challenges.cloudflare.com https://accounts.google.com https://apis.google.com; frame-src 'self' blob: data: https://*.supabase.co https://checkout.paystack.com https://standard.paystack.co https://js.paystack.co https://challenges.cloudflare.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com https://standard.paystack.co https://accounts.google.com; frame-ancestors 'self'; upgrade-insecure-requests;"
    Vary = "Origin"
# Dedicated Administrative Anti-Clickjacking Lockdown (OWASP ASVS & CBN)
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://js.paystack.co https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://ui-avatars.com https://*.googleusercontent.com https://flagcdn.com https://flagsapi.com https://*.paystack.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.paystack.co https://checkout.paystack.com https://standard.paystack.co https://api.korapay.com https://generativelanguage.googleapis.com https://challenges.cloudflare.com https://accounts.google.com https://apis.google.com; frame-src 'self' blob: data: https://*.supabase.co https://checkout.paystack.com https://standard.paystack.co https://js.paystack.co https://challenges.cloudflare.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com https://standard.paystack.co https://accounts.google.com; frame-ancestors 'none'; upgrade-insecure-requests;"
